<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineBook</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-page">

    <div class="login-card">

        <a href="index.html" class="back-home">← Kembali ke CineBook</a>

        <div class="login-logo">
            🎬 <span>Cine</span><b>Book</b>
        </div>

        <h1>Selamat Datang</h1>
        <p class="subtitle">Login untuk melanjutkan pemesanan tiket</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Nama Pengguna</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan nama pengguna"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" id="togglePassword">👁</button>
                </div>
            </div>

            <label class="remember">
                <input type="checkbox" id="remember">
                Ingat saya
            </label>

            <button type="submit" class="login-submit">
                🔐 Login
            </button>

            <p id="loginMessage" class="login-message"></p>
        </form>

       
    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("loginMessage");
const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function () {
    const isPassword = password.type === "password";
    password.type = isPassword ? "text" : "password";
    togglePassword.textContent = isPassword ? "🙈" : "👁";
});

form.addEventListener("submit", function (event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const passwordValue = password.value;
    const remember = document.getElementById("remember").checked;

    if (username === "admin" && passwordValue === "12345") {

        const userData = {
            username: username,
            loginAt: new Date().toLocaleString("id-ID")
        };

        if (remember) {
            localStorage.setItem("cinebookUser", JSON.stringify(userData));
        } else {
            sessionStorage.setItem("cinebookUser", JSON.stringify(userData));
        }

        message.textContent = "✓ Login berhasil. Mengalihkan...";
        message.className = "login-message success";

        setTimeout(function () {
            window.location.href = "index.html";
        }, 700);

    } else {
        message.textContent = "✕ Username atau password salah.";
        message.className = "login-message error";
    }
});
</script>

</body>
</html>
